<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table></table>
    <h2>HTML Forms</h2>
    <p>Please fill in this form to create an account.</p>
    <form action="/action_page.php">
    <label for="fname">Email</label>
    <input type="email" id="fname" name="fname" placeholder="Enter your email">

    <label for="lname">Password</label>
    <input type="password" id="lname" name="lname" placeholder="Enter your password">

    <label for="lname">Repeat Password</label>
    <input type="password" id="lname" name="lname" placeholder="Repeat your password">

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob">

    <label for="gender">Gender</label>
  
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male">

    
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female">
    

    <label for="other">Other</label>
    <input type="radio" id="other" name="gender" value="other">

    <input type="checkbox" id="me" name="me" value="me">

    <label for="me"> Remember me</label><br>
   
    <!-- BUTTON TO SUBMIT THE FORM -->
    <input type="submit" value="Submit">
    </form> 

    <p>If you click the "Submit" button, the form-data will be sent to a page called "/action_page.php".</p>
</body>
</html>
