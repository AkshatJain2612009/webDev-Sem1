<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid rgb(251, 248, 248);
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #5845fc;
        }
        td {
            background-color: #c60de643;
        }
        tr:nth-child(even) td {
            background-color: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
        
    </style>
</head>
<body>
    <br>
    <h1>Country Information</h1>
    <br>
    <br>
    <br>
    <br>
    <br>
    <table border="1" width="100%" cellspacing="0" cellpadding="10">
        <caption><h4>List of Countries and their Capitals</h4></caption>
        <thead>
            <tr>
                <th>Country</th>
                <th>Capital</th>
                <th>Language</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <td colspan="3">Copyright &copy; 2026</td>
            </tr>
        </tfoot>
        <tbody>     
        <tr>
            <td>India</td>
            <td>New Delhi</td>
            <td>Hindi</td>   
        </tr>
        <tr>
            <td>France</td>
            <td>Paris</td>
            <td>French</td>
        </tr>
        <tr>
            <td>New Zealand</td>
            <td>Wellington</td>
            <td>English</td>
        </tr>
        </tbody>
    </table>    

</body>
</html>
